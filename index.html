<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HDS — Messages</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    background: #0d0d12;
    color: #f1f1f5;
    font-family: Arial, sans-serif;

    display: flex;
    align-items: center;
    justify-content: center;
}

button,
input {
    font: inherit;
}

.app {
    width: min(950px, 94vw);
    height: min(620px, 90vh);

    display: flex;
    overflow: hidden;

    background: #15151c;
    border: 1px solid #30303c;
    border-radius: 14px;

    box-shadow: 0 30px 80px rgba(0,0,0,.55);
}

/* SIDEBAR */

.sidebar {
    width: 280px;
    flex-shrink: 0;

    background: #111117;
    border-right: 1px solid #292934;

    display: flex;
    flex-direction: column;
}

.brand {
    height: 64px;

    display: flex;
    align-items: center;

    padding: 0 20px;

    border-bottom: 1px solid #292934;
}

.brand-name {
    font-size: 21px;
    font-weight: 800;
    letter-spacing: 1px;

    color: #8577ff;
}

.add-user {
    padding: 12px;
}

.add-user input {
    width: 100%;
    height: 40px;

    padding: 0 12px;

    background: #1b1b23;
    border: 1px solid #30303b;
    border-radius: 8px;

    color: white;
    outline: none;
}

.add-user input:focus {
    border-color: #7062ff;
}

.add-user button {
    width: 100%;
    height: 36px;

    margin-top: 7px;

    border: 0;
    border-radius: 7px;

    background: #6255df;
    color: white;

    cursor: pointer;
    font-weight: 700;
}

.add-user button:hover {
    background: #7164ef;
}

.section-title {
    padding: 8px 14px;

    color: #777789;
    font-size: 11px;
    font-weight: bold;
    text-transform: uppercase;
}

.users {
    flex: 1;
    overflow-y: auto;
    padding: 5px 8px;
}

.user {
    width: 100%;

    padding: 10px;

    display: flex;
    align-items: center;
    gap: 10px;

    border: 0;
    border-radius: 8px;

    background: transparent;
    color: white;

    cursor: pointer;
    text-align: left;
}

.user:hover,
.user.active {
    background: #29263f;
}

.avatar {
    width: 38px;
    height: 38px;

    flex-shrink: 0;

    border-radius: 50%;

    display: flex;
    align-items: center;
    justify-content: center;

    background: linear-gradient(135deg, #6e5cff, #9b7cff);

    font-weight: bold;
}

.user-info {
    min-width: 0;
}

.username {
    font-size: 14px;
    font-weight: 600;
}

.user-id {
    margin-top: 3px;

    color: #777789;
    font-size: 10px;
}

/* CHAT */

.chat {
    flex: 1;
    min-width: 0;

    display: flex;
    flex-direction: column;
}

.chat-header {
    height: 64px;

    flex-shrink: 0;

    padding: 0 18px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    border-bottom: 1px solid #292934;
    background: #17171e;
}

.chat-person {
    display: flex;
    align-items: center;
    gap: 10px;
}

.chat-name {
    font-size: 15px;
    font-weight: bold;
}

.chat-status {
    margin-top: 3px;

    color: #777789;
    font-size: 11px;
}

.header-buttons {
    display: flex;
    gap: 5px;
}

.icon-button {
    width: 34px;
    height: 34px;

    border: 0;
    border-radius: 7px;

    background: transparent;
    color: #aaaabd;

    cursor: pointer;
    font-size: 18px;
}

.icon-button:hover {
    background: #272731;
    color: white;
}

/* MESSAGES */

.messages {
    flex: 1;

    overflow-y: auto;

    padding: 20px;
}

.empty {
    height: 100%;

    display: flex;
    align-items: center;
    justify-content: center;

    color: #666677;

    text-align: center;
}

.message {
    display: flex;
    gap: 10px;

    margin-bottom: 18px;
}

.message.mine {
    flex-direction: row-reverse;
}

.message-avatar {
    width: 32px;
    height: 32px;

    flex-shrink: 0;

    border-radius: 50%;

    display: flex;
    align-items: center;
    justify-content: center;

    background: #5045a8;

    font-size: 11px;
    font-weight: bold;
}

.message-body {
    max-width: 70%;
}

.message.mine .message-body {
    text-align: right;
}

.message-meta {
    margin-bottom: 4px;

    color: #777789;
    font-size: 10px;
}

.message-text {
    display: inline-block;

    padding: 9px 12px;

    border-radius: 10px;

    background: #25252f;

    font-size: 14px;
    line-height: 1.4;

    word-break: break-word;
}

.mine .message-text {
    background: #6254df;
}

/* COMPOSER */

.composer {
    padding: 12px 16px;

    display: flex;
    gap: 8px;

    border-top: 1px solid #292934;
    background: #17171e;
}

.composer input {
    flex: 1;

    height: 42px;

    padding: 0 13px;

    border: 1px solid #30303b;
    border-radius: 8px;

    background: #202029;
    color: white;

    outline: none;
}

.composer input:focus {
    border-color: #6f61ff;
}

.send {
    width: 70px;
    height: 42px;

    border: 0;
    border-radius: 8px;

    background: #6658e8;
    color: white;

    cursor: pointer;
    font-weight: bold;
}

.send:hover {
    background: #7568f5;
}

.error {
    padding: 0 12px 8px;

    color: #ff7272;

    font-size: 11px;
}
</style>
</head>

<body>

<div class="app" id="app">

    <!-- SIDEBAR -->

    <aside class="sidebar">

        <div class="brand">
            <div class="brand-name">HDS</div>
        </div>

        <div class="add-user">

            <input
                id="usernameInput"
                type="text"
                placeholder="Enter Roblox username"
                maxlength="20"
                autocomplete="off"
            >

            <button id="addUserButton">
                Open DM
            </button>

            <div class="error" id="error"></div>

        </div>

        <div class="section-title">
            Conversations
        </div>

        <div class="users" id="users"></div>

    </aside>


    <!-- CHAT -->

    <main class="chat">

        <header class="chat-header">

            <div class="chat-person">

                <div class="avatar" id="headerAvatar">
                    ?
                </div>

                <div>

                    <div class="chat-name" id="chatName">
                        Select a user
                    </div>

                    <div class="chat-status" id="chatStatus">
                        Enter a Roblox username to begin
                    </div>

                </div>

            </div>

            <div class="header-buttons">

                <button
                    class="icon-button"
                    id="minimizeButton"
                    title="Minimize"
                >
                    −
                </button>

                <button
                    class="icon-button"
                    id="closeButton"
                    title="Close"
                >
                    ×
                </button>

            </div>

        </header>


        <section class="messages" id="messages">

            <div class="empty" id="emptyState">
                Enter a Roblox username on the left to start a DM.
            </div>

        </section>


        <div class="composer">

            <input
                id="messageInput"
                type="text"
                maxlength="500"
                placeholder="Select someone first..."
                autocomplete="off"
                disabled
            >

            <button
                class="send"
                id="sendButton"
                disabled
            >
                Send
            </button>

        </div>

    </main>

</div>


<script>

const conversations = {};

let users = [];
let selectedUser = null;


/* ELEMENTS */

const usernameInput =
    document.getElementById("usernameInput");

const addUserButton =
    document.getElementById("addUserButton");

const errorElement =
    document.getElementById("error");

const usersElement =
    document.getElementById("users");

const messagesElement =
    document.getElementById("messages");

const chatName =
    document.getElementById("chatName");

const chatStatus =
    document.getElementById("chatStatus");

const headerAvatar =
    document.getElementById("headerAvatar");

const messageInput =
    document.getElementById("messageInput");

const sendButton =
    document.getElementById("sendButton");

const app =
    document.getElementById("app");


/* HELPERS */

function initials(name) {

    return name
        .split(" ")
        .map(x => x[0])
        .join("")
        .substring(0, 2)
        .toUpperCase();

}


function showError(message) {

    errorElement.textContent = message;

    setTimeout(() => {

        errorElement.textContent = "";

    }, 4000);

}


/*
    This function currently creates the user locally.

    Later, replace the inside of this function with
    your HDS backend request.

    Example:

    const response = await fetch(
        "https://your-server.com/roblox/user/" +
        encodeURIComponent(username)
    );

    const user = await response.json();
*/

async function findRobloxUser(username) {

    username = username.trim();

    if (!username) {
        throw new Error("Enter a username.");
    }

    if (!/^[A-Za-z0-9_]{3,20}$/.test(username)) {
        throw new Error("Invalid Roblox username.");
    }


    /*
        TEMPORARY USER OBJECT

        Your backend should eventually verify that
        this Roblox username actually exists and return:

        {
            id: RobloxUserId,
            name: RobloxUsername,
            displayName: RobloxDisplayName
        }
    */

    return {
        id: username.toLowerCase(),
        name: username,
        displayName: username
    };
}


/* ADD USER */

async function addUser() {

    errorElement.textContent = "";

    const username =
        usernameInput.value.trim();

    if (!username) {

        showError("Enter a Roblox username.");

        return;
    }


    addUserButton.disabled = true;
    addUserButton.textContent = "Loading...";


    try {

        const user =
            await findRobloxUser(username);


        const existing =
            users.find(
                x => x.id === user.id
            );


        if (!existing) {

            users.push(user);

        }


        usernameInput.value = "";

        renderUsers();

        selectUser(user);


    } catch (error) {

        showError(error.message);

    }


    addUserButton.disabled = false;
    addUserButton.textContent = "Open DM";
}


/* RENDER USER LIST */

function renderUsers() {

    usersElement.innerHTML = "";


    users.forEach(user => {

        const button =
            document.createElement("button");

        button.className = "user";


        if (
            selectedUser &&
            selectedUser.id === user.id
        ) {

            button.classList.add("active");

        }


        const avatar =
            document.createElement("div");

        avatar.className = "avatar";

        avatar.textContent =
            initials(user.displayName || user.name);


        const info =
            document.createElement("div");

        info.className = "user-info";


        const username =
            document.createElement("div");

        username.className = "username";

        username.textContent =
            user.displayName || user.name;


        const userId =
            document.createElement("div");

        userId.className = "user-id";

        userId.textContent =
            "@" + user.name;


        info.appendChild(username);
        info.appendChild(userId);

        button.appendChild(avatar);
        button.appendChild(info);


        button.addEventListener(
            "click",
            () => selectUser(user)
        );


        usersElement.appendChild(button);

    });

}


/* SELECT USER */

function selectUser(user) {

    selectedUser = user;


    if (!conversations[user.id]) {

        conversations[user.id] = [];

    }


    chatName.textContent =
        user.displayName || user.name;

    chatStatus.textContent =
        "@" + user.name;

    headerAvatar.textContent =
        initials(user.displayName || user.name);


    messageInput.disabled = false;
    sendButton.disabled = false;

    messageInput.placeholder =
        "Message @" + user.name + "...";


    renderUsers();

    renderMessages();

    messageInput.focus();

}


/* RENDER MESSAGES */

function renderMessages() {

    messagesElement.innerHTML = "";


    if (!selectedUser) {

        const empty =
            document.createElement("div");

        empty.className = "empty";

        empty.textContent =
            "Enter a Roblox username to start a DM.";

        messagesElement.appendChild(empty);

        return;
    }


    const messages =
        conversations[selectedUser.id] || [];


    if (messages.length === 0) {

        const empty =
            document.createElement("div");

        empty.className = "empty";

        empty.textContent =
            "No messages yet. Say hello!";

        messagesElement.appendChild(empty);

        return;
    }


    messages.forEach(message => {

        const wrapper =
            document.createElement("div");

        wrapper.className = "message";


        if (message.mine) {

            wrapper.classList.add("mine");

        }


        const avatar =
            document.createElement("div");

        avatar.className =
            "message-avatar";

        avatar.textContent =
            message.mine
                ? "ME"
                : initials(selectedUser.name);


        const body =
            document.createElement("div");

        body.className =
            "message-body";


        const meta =
            document.createElement("div");

        meta.className =
            "message-meta";

        meta.textContent =
            `${message.mine ? "You" : selectedUser.name} • ${message.time}`;


        const text =
            document.createElement("div");

        text.className =
            "message-text";

        text.textContent =
            message.text;


        body.appendChild(meta);
        body.appendChild(text);

        wrapper.appendChild(avatar);
        wrapper.appendChild(body);

        messagesElement.appendChild(wrapper);

    });


    messagesElement.scrollTop =
        messagesElement.scrollHeight;

}


/* SEND MESSAGE */

function sendMessage() {

    if (!selectedUser) {
        return;
    }


    const text =
        messageInput.value.trim();


    if (!text) {
        return;
    }


    /*
        TEMPORARY LOCAL MESSAGE.

        Later send this to:

        POST /dm/send

        Your backend should:

        1. Authenticate the sender.
        2. Verify the recipient.
        3. Filter the message.
        4. Deliver it to the recipient.
        5. Return the filtered message.
    */


    conversations[selectedUser.id].push({

        text: text,

        mine: true,

        time:
            new Date().toLocaleTimeString([], {
                hour: "2-digit",
                minute: "2-digit"
            })

    });


    messageInput.value = "";

    renderMessages();

}


/* EVENTS */

addUserButton.addEventListener(
    "click",
    addUser
);


usernameInput.addEventListener(
    "keydown",
    event => {

        if (event.key === "Enter") {

            event.preventDefault();

            addUser();

        }

    }
);


sendButton.addEventListener(
    "click",
    sendMessage
);


messageInput.addEventListener(
    "keydown",
    event => {

        if (event.key === "Enter") {

            event.preventDefault();

            sendMessage();

        }

    }
);


/* MINIMIZE */

let minimized = false;

document
    .getElementById("minimizeButton")
    .addEventListener("click", () => {

        minimized = !minimized;


        if (minimized) {

            app.style.height = "64px";

        } else {

            app.style.height = "";

        }

    });


/* CLOSE */

document
    .getElementById("closeButton")
    .addEventListener("click", () => {

        app.style.display = "none";

    });


/* START */

renderUsers();

</script>

</body>
</html>
