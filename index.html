<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HDS — Messages</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            background:
                radial-gradient(circle at top left, #202040 0%, transparent 35%),
                #0d0d12;
            color: #f1f1f5;
            font-family: Arial, Helvetica, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        button,
        input {
            font: inherit;
        }

        .app {
            width: min(1000px, 94vw);
            height: min(650px, 90vh);
            min-width: 320px;
            min-height: 400px;

            display: flex;
            overflow: hidden;

            background: #15151c;
            border: 1px solid #30303c;
            border-radius: 14px;

            box-shadow:
                0 30px 80px rgba(0, 0, 0, .55),
                0 0 40px rgba(100, 90, 255, .08);
        }

        /* Sidebar */

        .sidebar {
            width: 280px;
            flex-shrink: 0;
            background: #111117;
            border-right: 1px solid #292934;

            display: flex;
            flex-direction: column;
        }

        .brand {
            height: 64px;
            padding: 0 20px;

            display: flex;
            align-items: center;

            border-bottom: 1px solid #292934;
        }

        .brand-name {
            font-size: 21px;
            font-weight: 800;
            letter-spacing: 1px;

            background: linear-gradient(90deg, #7c6cff, #a88cff);
            -webkit-background-clip: text;
            color: transparent;
        }

        .search {
            padding: 12px;
        }

        .search input {
            width: 100%;
            height: 38px;

            padding: 0 12px;

            border: 1px solid #30303b;
            border-radius: 8px;

            outline: none;
            background: #1b1b23;
            color: white;
        }

        .search input:focus {
            border-color: #6f61ff;
        }

        .section-title {
            padding: 10px 14px 6px;

            color: #777789;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: .8px;
        }

        .users {
            flex: 1;
            overflow-y: auto;
            padding: 5px 8px;
        }

        .user {
            width: 100%;
            padding: 10px;

            display: flex;
            align-items: center;
            gap: 10px;

            border: 0;
            border-radius: 8px;

            background: transparent;
            color: white;

            cursor: pointer;
            text-align: left;
        }

        .user:hover {
            background: #20202a;
        }

        .user.active {
            background: #29263f;
        }

        .avatar {
            width: 38px;
            height: 38px;
            flex-shrink: 0;

            border-radius: 50%;

            display: flex;
            align-items: center;
            justify-content: center;

            background: linear-gradient(135deg, #6e5cff, #9b7cff);
            color: white;
            font-weight: 700;
        }

        .user-info {
            min-width: 0;
        }

        .username {
            font-size: 14px;
            font-weight: 600;
        }

        .status {
            margin-top: 3px;
            color: #777789;
            font-size: 11px;
        }

        .online {
            color: #58d68d;
        }

        /* Main chat */

        .chat {
            flex: 1;
            min-width: 0;

            display: flex;
            flex-direction: column;
        }

        .chat-header {
            height: 64px;
            flex-shrink: 0;

            padding: 0 18px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            border-bottom: 1px solid #292934;
            background: #17171e;
        }

        .chat-person {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .chat-name {
            font-size: 15px;
            font-weight: 700;
        }

        .chat-status {
            margin-top: 3px;
            color: #777789;
            font-size: 11px;
        }

        .header-buttons {
            display: flex;
            gap: 6px;
        }

        .icon-button {
            width: 34px;
            height: 34px;

            border: 0;
            border-radius: 7px;

            background: transparent;
            color: #aaaabd;

            cursor: pointer;
            font-size: 17px;
        }

        .icon-button:hover {
            background: #272731;
            color: white;
        }

        /* Messages */

        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }

        .empty {
            height: 100%;

            display: flex;
            align-items: center;
            justify-content: center;

            color: #666677;
            text-align: center;
        }

        .message {
            display: flex;
            gap: 10px;
            margin-bottom: 18px;
        }

        .message.mine {
            flex-direction: row-reverse;
        }

        .message-avatar {
            width: 32px;
            height: 32px;
            flex-shrink: 0;

            border-radius: 50%;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #5045a8;

            font-size: 12px;
            font-weight: 700;
        }

        .message-body {
            max-width: 70%;
        }

        .message.mine .message-body {
            text-align: right;
        }

        .message-meta {
            margin-bottom: 4px;

            color: #777789;
            font-size: 10px;
        }

        .message-text {
            display: inline-block;

            padding: 9px 12px;

            border-radius: 10px;

            background: #25252f;
            color: #eeeeF5;

            font-size: 14px;
            line-height: 1.4;
            word-break: break-word;
        }

        .mine .message-text {
            background: #6254df;
        }

        /* Composer */

        .composer {
            padding: 12px 16px;

            display: flex;
            gap: 8px;

            border-top: 1px solid #292934;
            background: #17171e;
        }

        .composer input {
            flex: 1;
            min-width: 0;
            height: 42px;

            padding: 0 13px;

            border: 1px solid #30303b;
            border-radius: 8px;

            outline: none;

            background: #202029;
            color: white;
        }

        .composer input:focus {
            border-color: #6f61ff;
        }

        .send {
            width: 70px;
            height: 42px;

            border: 0;
            border-radius: 8px;

            background: #6658e8;
            color: white;

            cursor: pointer;
            font-weight: 700;
        }

        .send:hover {
            background: #7568f5;
        }

        .send:active {
            transform: scale(.97);
        }

        /* Mobile */

        @media (max-width: 650px) {
            .app {
                width: 100vw;
                height: 100vh;
                border-radius: 0;
            }

            .sidebar {
                width: 75px;
            }

            .brand {
                justify-content: center;
                padding: 0;
            }

            .brand-name {
                font-size: 16px;
            }

            .search,
            .section-title,
            .user-info {
                display: none;
            }

            .users {
                padding: 8px;
            }

            .user {
                justify-content: center;
                padding: 8px;
            }

            .message-body {
                max-width: 80%;
            }
        }
    </style>
</head>

<body>

<div class="app">

    <!-- Sidebar -->

    <aside class="sidebar">

        <div class="brand">
            <div class="brand-name">HDS</div>
        </div>

        <div class="search">
            <input
                id="search"
                type="text"
                placeholder="Search users..."
                autocomplete="off"
            >
        </div>

        <div class="section-title">
            Direct Messages
        </div>

        <div class="users" id="users"></div>

    </aside>


    <!-- Chat -->

    <main class="chat">

        <header class="chat-header">

            <div class="chat-person">

                <div class="avatar" id="headerAvatar">
                    ?
                </div>

                <div>
                    <div class="chat-name" id="chatName">
                        Select a user
                    </div>

                    <div class="chat-status" id="chatStatus">
                        Choose someone to start chatting
                    </div>
                </div>

            </div>

            <div class="header-buttons">

                <button
                    class="icon-button"
                    title="Minimize"
                    onclick="toggleMinimize()"
                >
                    −
                </button>

                <button
                    class="icon-button"
                    title="Close"
                    onclick="closeChat()"
                >
                    ×
                </button>

            </div>

        </header>


        <section class="messages" id="messages">

            <div class="empty" id="emptyState">
                Select someone from the left to start a conversation.
            </div>

        </section>


        <div class="composer">

            <input
                id="messageInput"
                type="text"
                maxlength="500"
                placeholder="Select someone first..."
                autocomplete="off"
                disabled
            >

            <button
                class="send"
                id="sendButton"
                disabled
            >
                Send
            </button>

        </div>

    </main>

</div>


<script>
    /*
        HDS FRONTEND

        This is currently a frontend-only interface.

        Later, connect these functions to your backend:

            loadUsers()
            sendMessage()
            receiveMessages()

        Do NOT put private API keys in this file.
    */


    const users = [
        {
            id: "1",
            name: "ExampleUser",
            online: true
        },
        {
            id: "2",
            name: "PlayerTwo",
            online: true
        },
        {
            id: "3",
            name: "PlayerThree",
            online: false
        }
    ];


    const conversations = {};

    let selectedUser = null;


    const usersElement = document.getElementById("users");
    const searchElement = document.getElementById("search");

    const messagesElement = document.getElementById("messages");
    const emptyState = document.getElementById("emptyState");

    const chatName = document.getElementById("chatName");
    const chatStatus = document.getElementById("chatStatus");
    const headerAvatar = document.getElementById("headerAvatar");

    const messageInput = document.getElementById("messageInput");
    const sendButton = document.getElementById("sendButton");


    function initials(name) {
        return name
            .split(" ")
            .map(part => part[0])
            .join("")
            .substring(0, 2)
            .toUpperCase();
    }


    function renderUsers(filter = "") {

        usersElement.innerHTML = "";

        const filtered = users.filter(user =>
            user.name.toLowerCase().includes(filter.toLowerCase())
        );


        filtered.forEach(user => {

            const button = document.createElement("button");

            button.className = "user";

            if (selectedUser && selectedUser.id === user.id) {
                button.classList.add("active");
            }


            const avatar = document.createElement("div");

            avatar.className = "avatar";
            avatar.textContent = initials(user.name);


            const info = document.createElement("div");

            info.className = "user-info";


            const username = document.createElement("div");

            username.className = "username";
            username.textContent = user.name;


            const status = document.createElement("div");

            status.className = "status";

            if (user.online) {
                status.classList.add("online");
                status.textContent = "Online";
            } else {
                status.textContent = "Offline";
            }


            info.appendChild(username);
            info.appendChild(status);

            button.appendChild(avatar);
            button.appendChild(info);


            button.addEventListener("click", () => {
                selectUser(user);
            });


            usersElement.appendChild(button);
        });
    }


    function selectUser(user) {

        selectedUser = user;

        chatName.textContent = user.name;

        chatStatus.textContent =
            user.online ? "Online" : "Offline";


        headerAvatar.textContent = initials(user.name);

        messageInput.disabled = false;
        sendButton.disabled = false;

        messageInput.placeholder =
            `Message ${user.name}...`;


        if (!conversations[user.id]) {
            conversations[user.id] = [];
        }


        renderMessages();

        renderUsers(searchElement.value);

        messageInput.focus();
    }


    function renderMessages() {

        messagesElement.innerHTML = "";


        if (!selectedUser) {

            messagesElement.appendChild(emptyState);

            return;
        }


        const messages =
            conversations[selectedUser.id] || [];


        if (messages.length === 0) {

            const empty = document.createElement("div");

            empty.className = "empty";

            empty.textContent =
                `Start a conversation with ${selectedUser.name}.`;

            messagesElement.appendChild(empty);

            return;
        }


        messages.forEach(message => {

            const wrapper = document.createElement("div");

            wrapper.className = "message";

            if (message.mine) {
                wrapper.classList.add("mine");
            }


            const avatar = document.createElement("div");

            avatar.className = "message-avatar";

            avatar.textContent =
                message.mine
                    ? "ME"
                    : initials(selectedUser.name);


            const body = document.createElement("div");

            body.className = "message-body";


            const meta = document.createElement("div");

            meta.className = "message-meta";

            meta.textContent =
                `${message.mine ? "You" : selectedUser.name} • ${message.time}`;


            const text = document.createElement("div");

            text.className = "message-text";

            // textContent prevents messages from injecting HTML.
            text.textContent = message.text;


            body.appendChild(meta);
            body.appendChild(text);

            wrapper.appendChild(avatar);
            wrapper.appendChild(body);

            messagesElement.appendChild(wrapper);
        });


        messagesElement.scrollTop =
            messagesElement.scrollHeight;
    }


    function sendMessage() {

        if (!selectedUser) return;

        const text =
            messageInput.value.trim();


        if (!text) return;


        /*
            TEMPORARY LOCAL MESSAGE

            Replace this with a fetch/WebSocket call
            to your HDS backend.
        */

        conversations[selectedUser.id].push({

            text: text,

            mine: true,

            time: new Date().toLocaleTimeString([], {
                hour: "2-digit",
                minute: "2-digit"
            })

        });


        messageInput.value = "";

        renderMessages();


        /*
            Example backend call:

            fetch("https://YOUR-HDS-BACKEND.example/dm/send", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    recipient: selectedUser.id,
                    message: text
                })
            });
        */
    }


    sendButton.addEventListener("click", sendMessage);


    messageInput.addEventListener("keydown", event => {

        if (event.key === "Enter") {
            event.preventDefault();
            sendMessage();
        }

    });


    searchElement.addEventListener("input", () => {

        renderUsers(searchElement.value);

    });


    function toggleMinimize() {

        const app =
            document.querySelector(".app");

        const current =
            app.dataset.minimized === "true";


        if (current) {

            app.style.height = "";
            app.dataset.minimized = "false";

        } else {

            app.style.height = "64px";
            app.dataset.minimized = "true";

        }

    }


    function closeChat() {

        const app =
            document.querySelector(".app");

        app.style.display = "none";

    }


    renderUsers();
</script>

</body>
</html>
