<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HDS — Messages</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    background: #0d0d12;
    color: #f1f1f5;
    font-family: Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
}

button,
input {
    font: inherit;
}

.app {
    width: min(950px, 94vw);
    height: min(620px, 90vh);
    display: flex;
    overflow: hidden;
    background: #15151c;
    border: 1px solid #30303c;
    border-radius: 14px;
    box-shadow: 0 30px 80px rgba(0,0,0,.55);
}

/* SIDEBAR */

.sidebar {
    width: 280px;
    flex-shrink: 0;
    background: #111117;
    border-right: 1px solid #292934;
    display: flex;
    flex-direction: column;
}

.brand {
    height: 64px;
    display: flex;
    align-items: center;
    padding: 0 20px;
    border-bottom: 1px solid #292934;
}

.brand-name {
    font-size: 21px;
    font-weight: 800;
    letter-spacing: 1px;
    color: #8577ff;
}

.add-user {
    padding: 12px;
}

.add-user input {
    width: 100%;
    height: 40px;
    padding: 0 12px;
    background: #1b1b23;
    border: 1px solid #30303b;
    border-radius: 8px;
    color: white;
    outline: none;
}

.add-user input:focus {
    border-color: #7062ff;
}

.add-user button {
    width: 100%;
    height: 36px;
    margin-top: 7px;
    border: 0;
    border-radius: 7px;
    background: #6255df;
    color: white;
    cursor: pointer;
    font-weight: 700;
}

.add-user button:hover {
    background: #7164ef;
}

.add-user button:disabled {
    opacity: .6;
    cursor: wait;
}

.section-title {
    padding: 8px 14px;
    color: #777789;
    font-size: 11px;
    font-weight: bold;
    text-transform: uppercase;
}

.users {
    flex: 1;
    overflow-y: auto;
    padding: 5px 8px;
}

.user {
    width: 100%;
    padding: 10px;
    display: flex;
    align-items: center;
    gap: 10px;
    border: 0;
    border-radius: 8px;
    background: transparent;
    color: white;
    cursor: pointer;
    text-align: left;
}

.user:hover,
.user.active {
    background: #29263f;
}

.avatar {
    width: 38px;
    height: 38px;
    flex-shrink: 0;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #6e5cff, #9b7cff);
    font-weight: bold;
}

.user-info {
    min-width: 0;
}

.username {
    font-size: 14px;
    font-weight: 600;
}

.user-id {
    margin-top: 3px;
    color: #777789;
    font-size: 10px;
}

.error {
    padding-top: 7px;
    color: #ff7272;
    font-size: 11px;
}

/* CHAT */

.chat {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
}

.chat-header {
    height: 64px;
    flex-shrink: 0;
    padding: 0 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid #292934;
    background: #17171e;
}

.chat-person {
    display: flex;
    align-items: center;
    gap: 10px;
}

.chat-name {
    font-size: 15px;
    font-weight: bold;
}

.chat-status {
    margin-top: 3px;
    color: #777789;
    font-size: 11px;
}

.header-buttons {
    display: flex;
    gap: 5px;
}

.icon-button {
    width: 34px;
    height: 34px;
    border: 0;
    border-radius: 7px;
    background: transparent;
    color: #aaaabd;
    cursor: pointer;
    font-size: 18px;
}

.icon-button:hover {
    background: #272731;
    color: white;
}

/* MESSAGES */

.messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
}

.empty {
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #666677;
    text-align: center;
}

.message {
    display: flex;
    gap: 10px;
    margin-bottom: 18px;
}

.message.mine {
    flex-direction: row-reverse;
}

.message-avatar {
    width: 32px;
    height: 32px;
    flex-shrink: 0;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #5045a8;
    font-size: 11px;
    font-weight: bold;
}

.message-body {
    max-width: 70%;
}

.message.mine .message-body {
    text-align: right;
}

.message-meta {
    margin-bottom: 4px;
    color: #777789;
    font-size: 10px;
}

.message-text {
    display: inline-block;
    padding: 9px 12px;
    border-radius: 10px;
    background: #25252f;
    font-size: 14px;
    line-height: 1.4;
    word-break: break-word;
}

.mine .message-text {
    background: #6254df;
}

/* COMPOSER */

.composer {
    padding: 12px 16px;
    display: flex;
    gap: 8px;
    border-top: 1px solid #292934;
    background: #17171e;
}

.composer input {
    flex: 1;
    min-width: 0;
    height: 42px;
    padding: 0 13px;
    border: 1px solid #30303b;
    border-radius: 8px;
    background: #202029;
    color: white;
    outline: none;
}

.composer input:focus {
    border-color: #6f61ff;
}

.send {
    width: 70px;
    height: 42px;
    border: 0;
    border-radius: 8px;
    background: #6658e8;
    color: white;
    cursor: pointer;
    font-weight: bold;
}

.send:hover {
    background: #7568f5;
}

.send:disabled {
    opacity: .5;
    cursor: not-allowed;
}

/* MOBILE */

@media (max-width: 650px) {
    .app {
        width: 100vw;
        height: 100vh;
        border-radius: 0;
    }

    .sidebar {
        width: 75px;
    }

    .brand {
        justify-content: center;
        padding: 0;
    }

    .brand-name {
        font-size: 16px;
    }

    .add-user,
    .section-title,
    .user-info {
        display: none;
    }

    .users {
        padding: 8px;
    }

    .user {
        justify-content: center;
        padding: 8px;
    }
}
</style>
</head>

<body>

<div class="app" id="app">

    <aside class="sidebar">

        <div class="brand">
            <div class="brand-name">HDS</div>
        </div>

        <div class="add-user">

            <input
                id="usernameInput"
                type="text"
                placeholder="Roblox username"
                maxlength="20"
                autocomplete="off"
            >

            <button id="addUserButton">
                Open DM
            </button>

            <div class="error" id="error"></div>

        </div>

        <div class="section-title">
            Conversations
        </div>

        <div class="users" id="users"></div>

    </aside>


    <main class="chat">

        <header class="chat-header">

            <div class="chat-person">

                <div class="avatar" id="headerAvatar">
                    ?
                </div>

                <div>
                    <div class="chat-name" id="chatName">
                        HDS
                    </div>

                    <div class="chat-status" id="chatStatus">
                        Connecting...
                    </div>
                </div>

            </div>

            <div class="header-buttons">

                <button
                    class="icon-button"
                    id="minimizeButton"
                    title="Minimize"
                >
                    −
                </button>

                <button
                    class="icon-button"
                    id="closeButton"
                    title="Close"
                >
                    ×
                </button>

            </div>

        </header>


        <section class="messages" id="messages">

            <div class="empty">
                Enter a Roblox username to start a DM.
            </div>

        </section>


        <div class="composer">

            <input
                id="messageInput"
                type="text"
                maxlength="500"
                placeholder="Select someone first..."
                autocomplete="off"
                disabled
            >

            <button
                class="send"
                id="sendButton"
                disabled
            >
                Send
            </button>

        </div>

    </main>

</div>


<script>

/*
==================================================
HDS CONFIG
==================================================
*/

const HDS_WS =
    "wss://hds-backend.max-zendelae8980.workers.dev/ws";


/*
==================================================
STATE
==================================================
*/

let socket = null;
let connected = false;

let myUsername = null;

let users = [];
let selectedUser = null;

const conversations = {};


/*
==================================================
ELEMENTS
==================================================
*/

const usernameInput =
    document.getElementById("usernameInput");

const addUserButton =
    document.getElementById("addUserButton");

const errorElement =
    document.getElementById("error");

const usersElement =
    document.getElementById("users");

const messagesElement =
    document.getElementById("messages");

const chatName =
    document.getElementById("chatName");

const chatStatus =
    document.getElementById("chatStatus");

const headerAvatar =
    document.getElementById("headerAvatar");

const messageInput =
    document.getElementById("messageInput");

const sendButton =
    document.getElementById("sendButton");

const app =
    document.getElementById("app");


/*
==================================================
USERNAME
==================================================
*/

myUsername =
    prompt("Enter your HDS username:");


if (!myUsername) {

    alert("You need an HDS username.");

    throw new Error(
        "No username provided."
    );

}


myUsername =
    myUsername.trim();


if (
    !/^[A-Za-z0-9_]{3,20}$/.test(
        myUsername
    )
) {

    alert(
        "Invalid username. Use 3-20 letters, numbers, or underscores."
    );

    throw new Error(
        "Invalid username."
    );

}


/*
==================================================
INITIALS
==================================================
*/

function initials(name) {

    return name
        .split(" ")
        .map(x => x[0])
        .join("")
        .substring(0, 2)
        .toUpperCase();

}


/*
==================================================
ERROR
==================================================
*/

function showError(message) {

    errorElement.textContent =
        message;

    setTimeout(() => {

        errorElement.textContent = "";

    }, 4000);

}


/*
==================================================
WEBSOCKET CONNECTION
==================================================
*/

function connect() {

    chatStatus.textContent =
        "Connecting to HDS...";


    socket =
        new WebSocket(HDS_WS);


    socket.addEventListener(
        "open",
        () => {

            connected = true;

            chatStatus.textContent =
                selectedUser
                    ? "Connected to HDS"
                    : "HDS connected";


            console.log(
                "[HDS] Connected."
            );


            socket.send(
                JSON.stringify({

                    type: "identify",

                    username: myUsername

                })
            );

        }
    );


    socket.addEventListener(
        "message",
        event => {

            let data;


            try {

                data =
                    JSON.parse(event.data);

            } catch {

                console.error(
                    "[HDS] Invalid server data."
                );

                return;

            }


            handleServerMessage(data);

        }
    );


    socket.addEventListener(
        "close",
        () => {

            connected = false;

            chatStatus.textContent =
                "Disconnected";


            console.log(
                "[HDS] Disconnected."
            );


            setTimeout(
                connect,
                3000
            );

        }
    );


    socket.addEventListener(
        "error",
        error => {

            console.error(
                "[HDS] WebSocket error:",
                error
            );

        }
    );

}


/*
==================================================
SERVER MESSAGES
==================================================
*/

function handleServerMessage(data) {

    if (data.type === "connected") {

        return;

    }


    if (data.type === "identified") {

        console.log(
            "[HDS] Logged in as:",
            data.username
        );

        return;

    }


    if (data.type === "dm") {

        receiveMessage(data);

        return;

    }


    if (data.type === "dm_sent") {

        return;

    }


    if (data.type === "delivery_failed") {

        showError(
            `${data.to} is offline.`
        );

        return;

    }


    if (data.type === "error") {

        showError(
            data.message
        );

        return;

    }

}


/*
==================================================
ADD USER
==================================================
*/

function addUser() {

    const username =
        usernameInput.value.trim();


    if (!username) {

        showError(
            "Enter a username."
        );

        return;

    }


    if (
        !/^[A-Za-z0-9_]{3,20}$/.test(
            username
        )
    ) {

        showError(
            "Invalid Roblox username."
        );

        return;

    }


    const existing =
        users.find(
            user =>
                user.name.toLowerCase() ===
                username.toLowerCase()
        );


    if (existing) {

        selectUser(existing);

        usernameInput.value = "";

        return;

    }


    const user = {

        id:
            username.toLowerCase(),

        name:
            username

    };


    users.push(user);

    conversations[user.id] ??= [];


    usernameInput.value = "";

    renderUsers();

    selectUser(user);

}


/*
==================================================
RENDER USERS
==================================================
*/

function renderUsers() {

    usersElement.innerHTML = "";


    users.forEach(user => {

        const button =
            document.createElement("button");


        button.className =
            "user";


        if (
            selectedUser &&
            selectedUser.id === user.id
        ) {

            button.classList.add(
                "active"
            );

        }


        const avatar =
            document.createElement("div");


        avatar.className =
            "avatar";


        avatar.textContent =
            initials(user.name);


        const info =
            document.createElement("div");


        info.className =
            "user-info";


        const username =
            document.createElement("div");


        username.className =
            "username";


        username.textContent =
            user.name;


        const id =
            document.createElement("div");


        id.className =
            "user-id";


        id.textContent =
            "@" + user.name;


        info.appendChild(username);
        info.appendChild(id);

        button.appendChild(avatar);
        button.appendChild(info);


        button.addEventListener(
            "click",
            () => selectUser(user)
        );


        usersElement.appendChild(
            button
        );

    });

}


/*
==================================================
SELECT USER
==================================================
*/

function selectUser(user) {

    selectedUser =
        user;


    conversations[user.id] ??= [];


    chatName.textContent =
        user.name;


    headerAvatar.textContent =
        initials(user.name);


    chatStatus.textContent =
        connected
            ? "Connected to HDS"
            : "Disconnected";


    messageInput.disabled =
        false;


    sendButton.disabled =
        false;


    messageInput.placeholder =
        `Message ${user.name}...`;


    renderUsers();

    renderMessages();

    messageInput.focus();

}


/*
==================================================
SEND MESSAGE
==================================================
*/

function sendMessage() {

    if (!connected) {

        showError(
            "HDS is not connected."
        );

        return;

    }


    if (!selectedUser) {

        showError(
            "Select someone first."
        );

        return;

    }


    const text =
        messageInput.value.trim();


    if (!text) {

        return;

    }


    /*
        Display locally immediately.
    */

    addMessage(
        selectedUser.id,
        {

            text:
                text,

            mine:
                true,

            time:
                getTime()

        }
    );


    /*
        Send to Cloudflare Worker.
    */

    socket.send(
        JSON.stringify({

            type:
                "dm",

            to:
                selectedUser.name,

            message:
                text

        })
    );


    messageInput.value = "";

}


/*
==================================================
RECEIVE MESSAGE
==================================================
*/

function receiveMessage(data) {

    const sender =
        data.from;


    let user =
        users.find(
            x =>
                x.name.toLowerCase() ===
                sender.toLowerCase()
        );


    if (!user) {

        user = {

            id:
                sender.toLowerCase(),

            name:
                sender

        };


        users.push(user);

        renderUsers();

    }


    addMessage(
        user.id,
        {

            text:
                data.message,

            mine:
                false,

            time:
                getTime()

        }
    );


    /*
        Automatically open the message
        if that conversation is selected.
    */

    if (
        selectedUser &&
        selectedUser.id === user.id
    ) {

        renderMessages();

    }

}


/*
==================================================
ADD MESSAGE
==================================================
*/

function addMessage(
    userId,
    message
) {

    conversations[userId] ??= [];


    conversations[userId].push(
        message
    );


    if (
        selectedUser &&
        selectedUser.id === userId
    ) {

        renderMessages();

    }

}


/*
==================================================
RENDER MESSAGES
==================================================
*/

function renderMessages() {

    messagesElement.innerHTML = "";


    if (!selectedUser) {

        const empty =
            document.createElement("div");


        empty.className =
            "empty";


        empty.textContent =
            "Enter a Roblox username to start a DM.";


        messagesElement.appendChild(
            empty
        );

        return;

    }


    const messages =
        conversations[
            selectedUser.id
        ] || [];


    if (messages.length === 0) {

        const empty =
            document.createElement("div");


        empty.className =
            "empty";


        empty.textContent =
            `No messages with ${selectedUser.name} yet.`;


        messagesElement.appendChild(
            empty
        );

        return;

    }


    messages.forEach(message => {

        const wrapper =
            document.createElement("div");


        wrapper.className =
            "message";


        if (message.mine) {

            wrapper.classList.add(
                "mine"
            );

        }


        const avatar =
            document.createElement("div");


        avatar.className =
            "message-avatar";


        avatar.textContent =
            message.mine
                ? "ME"
                : initials(
                    selectedUser.name
                );


        const body =
            document.createElement("div");


        body.className =
            "message-body";


        const meta =
            document.createElement("div");


        meta.className =
            "message-meta";


        meta.textContent =
            `${
                message.mine
                    ? "You"
                    : selectedUser.name
            } • ${message.time}`;


        const text =
            document.createElement("div");


        text.className =
            "message-text";


        /*
            Use textContent rather than
            innerHTML for user messages.
        */

        text.textContent =
            message.text;


        body.appendChild(meta);

        body.appendChild(text);

        wrapper.appendChild(avatar);

        wrapper.appendChild(body);


        messagesElement.appendChild(
            wrapper
        );

    });


    messagesElement.scrollTop =
        messagesElement.scrollHeight;

}


/*
==================================================
TIME
==================================================
*/

function getTime() {

    return new Date()
        .toLocaleTimeString(
            [],
            {
                hour: "2-digit",
                minute: "2-digit"
            }
        );

}


/*
==================================================
EVENTS
==================================================
*/

addUserButton.addEventListener(
    "click",
    addUser
);


usernameInput.addEventListener(
    "keydown",
    event => {

        if (event.key === "Enter") {

            event.preventDefault();

            addUser();

        }

    }
);


sendButton.addEventListener(
    "click",
    sendMessage
);


messageInput.addEventListener(
    "keydown",
    event => {

        if (event.key === "Enter") {

            event.preventDefault();

            sendMessage();

        }

    }
);


/*
==================================================
MINIMIZE
==================================================
*/

let minimized = false;


document
    .getElementById("minimizeButton")
    .addEventListener(
        "click",
        () => {

            minimized =
                !minimized;


            app.style.height =
                minimized
                    ? "64px"
                    : "";

        }
    );


/*
==================================================
CLOSE
==================================================
*/

document
    .getElementById("closeButton")
    .addEventListener(
        "click",
        () => {

            app.style.display =
                "none";

        }
    );


/*
==================================================
START HDS
==================================================
*/

connect();

</script>

</body>
</html>
